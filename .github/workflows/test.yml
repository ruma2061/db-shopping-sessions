name: C++ correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile native engine
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic src/main.cpp -o sessions-core
      - name: Native boundary and differential tests
        run: SESSIONS_CORE=./sessions-core python tests/test_core.py
      - name: Install Parquet writer and test serialization
        run: |
          python -m pip install pyarrow==19.0.1
          python tests/test_parquet.py
      - name: Build Linux image
        run: docker build --platform linux/amd64 -t shopping-sessions .
      - name: Restricted container smoke test
        run: TEST_CPUS=2 TEST_MEM_GB=2 python tests/test_container.py
